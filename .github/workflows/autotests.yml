name: .NET Regression Tests

on: # Запускается при push и pull request файлов .cs в ветку master
  push:
    branches: ["master"]
    paths:
      - "**.cs"
      - ".github/workflows/**.yml"
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # ОС виртуальной машины

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Клонирование репозитория на ВМ

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # Установка .NET 10 на ВМ

      - name: Restore dependencies
        run: dotnet restore # Восстановление зависимостей

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests and generate TRX log
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"
